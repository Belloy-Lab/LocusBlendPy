[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "locusblend"
version = "0.1.0.dev0"
description = "Regional visualization of GWAS and QTL signals with multi-index LD coloring"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Chenyu Yang" },
    { name = "Noah Cook" },
    { name = "Youjie Zeng" },
    { name = "Tianyi Fu" },
    { name = "Michael E. Belloy" },
]
keywords = ["gwas", "locus-zoom", "linkage-disequilibrium", "visualization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Runtime dependencies: exactly the third-party modules imported at module
# level by src/locusblend/ (audited with an import scan).
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "plotly>=5.0",
]

[project.optional-dependencies]
# Static PNG rendering (plot() output=..., export.py) and the Pillow-based
# image composition helpers. kaleido>=1 also needs a local Chrome/Chromium.
export = ["pillow", "kaleido"]
# Parquet gene tables only (genes.py: load_gene_table).
genes = ["pyarrow>=6.0"]
# Recombination-rate BigWig overlay only (plotting.py: _read_recomb_track_bw).
recomb = ["pyBigWig"]
# Development/test tooling; not required to use the package.
dev = ["pytest"]

[project.urls]
Homepage = "https://locusblend.wustl.edu"
Repository = "https://github.com/Belloy-Lab/LocusBlendPy"
Issues = "https://github.com/Belloy-Lab/LocusBlendPy/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
